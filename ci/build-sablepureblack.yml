name: Build SablePureBlack APK

# Produces a signed, installable app-release.apk on GitHub's runners.
# Trigger: any push touching the module, or manual dispatch from the Actions tab.

on:
  push:
    paths:
      - 'sablepureblack/**'
      - '.github/workflows/build-sablepureblack.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Variant to build'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]

permissions:
  contents: read

jobs:
  build:
    name: assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sablepureblack/**/*.gradle.kts', 'sablepureblack/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: sablepureblack
        run: chmod +x gradlew

      - name: Write local.properties
        working-directory: sablepureblack
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Build
        working-directory: sablepureblack
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}

      - name: Verify APK
        working-directory: sablepureblack
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          # A signed APK always carries a manifest + signature block; fail loudly otherwise.
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'
          echo "Signed APK verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SablePureBlack-${{ github.event.inputs.build_type == 'debug' && 'debug' || 'release' }}
          path: sablepureblack/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
